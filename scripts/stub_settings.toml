# Stub Generator Configuration


[output]
stub_dir = "stubs"                # output directory for generated .pyi files
overwrite = true                  # overwrite existing stubs


[repositories]
names = [
    "boardfarm",
    "boardfarm-arris",
    "boardfarm-broadcom",
    "boardfarm-cbn",
    "boardfarm-docsis",
    "boardfarm-excentis",
    "boardfarm-intel",
    "boardfarm-lgi",
    "boardfarm-lgi-conn-oemqa-tests",
    "boardfarm-lgi-shared",
    "boardfarm-lgi-utils",
    "boardfarm-pon",
    "boardfarm-sagemcom",
    "boardfarm-vmie",
    "pytest-boardfarm",
]

# ==============================================================================
# Global filters — applied to ALL repositories
# ==============================================================================
[filters]
exclude_dirs = [
    "__pycache__",
    ".git",
    ".tox",
    ".mypy_cache",
    ".pytest_cache",
    ".eggs",
    "node_modules",
    ".vscode",
    ".github",
    "venv",
    ".venv",
    "env",
    ".env",
    "build",
    "dist",
    "*.egg-info",
    "migrations",
    "tests",
    "test",
    "testing",
    "unittests",
]

exclude_files = [
    "setup.py",
    "conftest.py",
    "test_*.py",
    "*_test.py",
    "*_tests.py",
    "noxfile.py",
]

# ==============================================================================
# Per-repository overrides
# ==============================================================================

[repositories.boardfarm]